[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "code-cad"
version = "0.1.0"
description = "Parametric Code-CAD engineering framework and agent skills for functional 3D printing with Claude Code, Antigravity, and build123d"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Cristobal Tormo", email = "info@cristobaltormo.com" }
]
dependencies = [
    "build123d>=0.5.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0"
]

[project.scripts]
codecad-inspect = "cad_tools.inspect:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cad_tools*"]
